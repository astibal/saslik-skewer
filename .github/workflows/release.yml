name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          grep -F "VERSION $RELEASE_TAG LANGUAGES" CMakeLists.txt
      - name: Build and test Ubuntu 26.04 package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          mkdir -p dist
          docker run --rm -e RELEASE_TAG -v "$PWD:/src:ro" -v "$PWD/dist:/out" ubuntu:26.04 bash /src/packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skewer-ubuntu-26.04-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skewer-ubuntu-26.04-amd64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS --verify-tag \
            --title "Skewer $RELEASE_TAG" --notes-file packaging/RELEASE.md
