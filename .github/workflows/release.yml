name: Release
on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          grep -F "VERSION $RELEASE_TAG LANGUAGES" CMakeLists.txt
      - name: Build shared DEB on Debian 12
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          mkdir -p dist
          docker run --rm --platform linux/amd64 -e RELEASE_TAG -v "$PWD:/src:ro" -v "$PWD/dist:/out" debian:12 bash /src/packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skewer-linux-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
  windows-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Qt installer
        run: python -m pip install aqtinstall==3.3.0
      - name: Build the Windows release package
        env:
          BUILD_JOBS: '4'
        run: ./packaging/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skewer-windows-amd64
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
            dist/windows/*.exe
            dist/windows/*.exe.sha256
  windows-verify:
    needs: windows-package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skewer-windows-amd64
          path: dist/windows
      - name: Verify Windows release artifacts
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath dist/windows -Filter 'skewer-windows-amd64-*.zip')
          if ($archive.Count -ne 1) { throw "Expected one Windows archive, found $($archive.Count)" }
          $tests = @(Get-ChildItem -LiteralPath dist/windows -Filter 'skewer-windows-tests-amd64-*.zip')
          if ($tests.Count -ne 1) { throw "Expected one Windows test archive, found $($tests.Count)" }
          function Test-ArchiveChecksum([System.IO.FileInfo]$item) {
            $sidecar = Get-Content -LiteralPath ($item.FullName + '.sha256') -Raw
            if ($sidecar -notmatch '^([0-9a-f]{64})\s+\*?([^\r\n]+)\s*$') {
              throw "Invalid checksum sidecar: $($item.Name)"
            }
            if ($Matches[2] -ne $item.Name) { throw "Checksum names a different archive: $($item.Name)" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Archive checksum mismatch: $($item.Name)" }
          }
          Test-ArchiveChecksum $archive[0]
          Test-ArchiveChecksum $tests[0]
          if ($archive[0].BaseName -notmatch '^skewer-windows-amd64-(\d+(?:\.\d+){3})$') {
            throw 'Windows archive has an invalid versioned name'
          }
          $version = $Matches[1]
          if ($tests[0].BaseName -ne "skewer-windows-tests-amd64-$version") {
            throw 'Windows package and test bundle versions differ'
          }
          $installer = @(Get-ChildItem -LiteralPath dist/windows -Filter 'SkewerSetup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected one Windows installer, found $($installer.Count)" }
          "SKEWER_WINDOWS_ARCHIVE=$($archive[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SKEWER_WINDOWS_TESTS=$($tests[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SKEWER_WINDOWS_INSTALLER=$($installer[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SKEWER_WINDOWS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run native Windows tests
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'skewer-native-tests'
          Expand-Archive -LiteralPath $env:SKEWER_WINDOWS_TESTS -DestinationPath $testRoot
          $testPackage = Join-Path $testRoot "skewer-windows-tests-amd64-$env:SKEWER_WINDOWS_VERSION"
          & (Join-Path $testPackage 'run-tests.ps1') -Root $testPackage
      - name: Verify portable Windows package
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'skewer-release-smoke'
          ./packaging/test-windows-package.ps1 -Archive $env:SKEWER_WINDOWS_ARCHIVE `
            -ExpectedVersion $env:SKEWER_WINDOWS_VERSION -TestRoot $smokeRoot
      - name: Verify Windows routing service installation
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'skewer-release-smoke'
          $package = Join-Path $smokeRoot "skewer-windows-amd64-$env:SKEWER_WINDOWS_VERSION"
          ./platform/windows/tests/install-routing-service-live.ps1 `
            -Directory $package -WinDivertDirectory $package `
            -WintunDll (Join-Path $package 'wintun.dll')
      - name: Verify Windows wizard installer
        shell: pwsh
        run: |
          ./packaging/test-windows-installer.ps1 -Installer $env:SKEWER_WINDOWS_INSTALLER `
            -ExpectedVersion $env:SKEWER_WINDOWS_VERSION
  install:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # This is the supported distribution list. Every entry is mandatory.
        image: ['debian:12', 'debian:13', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skewer-linux-amd64
          path: dist
      - name: Verify identical artifact
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install and start packaged application
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/src:ro" -v "$PWD/dist:/packages:ro" "$TEST_IMAGE" bash /src/packaging/test-installed.sh
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, install, windows-package, windows-verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skewer-linux-amd64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: skewer-windows-amd64
          path: dist/windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          windows=(dist/windows/skewer-windows-amd64-[0-9]*.zip)
          [[ ${#windows[@]} -eq 1 && -f "${windows[0]}" ]]
          installers=(dist/windows/SkewerSetup-[0-9]*.exe)
          [[ ${#installers[@]} -eq 1 && -f "${installers[0]}" ]]
          cp "${windows[0]}" dist/windows/skewer-windows-amd64.zip
          cp "${installers[0]}" dist/windows/SkewerSetup.exe
          (cd dist/windows && sha256sum skewer-windows-amd64.zip > skewer-windows-amd64.zip.sha256)
          (cd dist/windows && sha256sum SkewerSetup.exe > SkewerSetup.exe.sha256)
          gh release create "$RELEASE_TAG" dist/linux/*.deb dist/linux/SHA256SUMS \
            "${windows[0]}" "${windows[0]}.sha256" \
            dist/windows/SkewerSetup-*.exe dist/windows/SkewerSetup-*.exe.sha256 \
            dist/windows/SkewerSetup.exe dist/windows/SkewerSetup.exe.sha256 \
            dist/windows/skewer-windows-amd64.zip dist/windows/skewer-windows-amd64.zip.sha256 \
            --verify-tag \
            --title "Skewer $RELEASE_TAG" --notes-file packaging/RELEASE.md
